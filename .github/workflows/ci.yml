name: Sync official collection
on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - master
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true
jobs:
  sync-collection:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.repository == 'algoux/srk-collection' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Find last successful sync commit
        id: last-success
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'master',
              status: 'success',
              per_page: 100,
            });
            const previous = runs.find((run) => run.id !== context.runId);
            core.setOutput('sha', previous ? previous.head_sha : '');
      - run: npm ci --production
      - name: Sync official collection
        id: sync
        run: npm run sync -- official --changed-from "${{ steps.last-success.outputs.sha }}" --changed-to "${{ github.event.workflow_run.head_sha }}"
        env:
          RL_API_AUTH_TOKEN: ${{ secrets.RL_API_AUTH_TOKEN }}

      - name: Prepare collection sync notification
        id: notification
        if: ${{ success() && steps.sync.outputs.synced == 'true' }}
        continue-on-error: true
        env:
          SYNC_SUMMARY: ${{ steps.sync.outputs.summary }}
          SYNC_COMMIT: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/build-sync-notification.js

      - name: Notify collection sync success
        if: ${{ success() && steps.notification.outcome == 'success' && steps.notification.outputs.body != '' }}
        continue-on-error: true
        uses: azurdream/meowpush-gh-actions@v1
        with:
          key: ${{ secrets.MEOWPUSH_KEY }}
          title: '${{ github.repository }} Sync Success'
          body: ${{ steps.notification.outputs.body }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          group: github-actions
